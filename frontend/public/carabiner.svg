<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Mountain -->
  <path d="M20 170 L80 50 L110 100 L130 70 L180 170 Z" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="3" stroke-linejoin="round"/>
  <!-- Snow cap -->
  <path d="M72 65 L80 50 L88 65 Z" fill="#22c55e" opacity="0.4"/>
  <!-- Flag pole -->
  <line x1="80" y1="50" x2="80" y2="25" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Flag -->
  <path d="M80 25 L100 32 L80 39" fill="#22c55e" opacity="0.8"/>
  <!-- Rope line -->
  <path d="M45 150 Q65 90 80 50" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4" opacity="0.5" fill="none"/>
  <!-- Carabiner at base -->
  <circle cx="45" cy="150" r="6" stroke="#22c55e" stroke-width="2" fill="none"/>
  <circle cx="45" cy="150" r="2" fill="#22c55e"/>
</svg>

